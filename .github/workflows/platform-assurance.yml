name: Platform assurance

# Builds the four declared native targets, assembles the root and platform tarballs
# once, and installs and executes exactly those tarballs on every target and
# supported Node line (registry-style optionalDependencies resolution included).
# It never publishes: run it by hand to rehearse a release, or let release.yml call
# it and publish the same artifacts. Each smoke run uploads an attestation that the
# publication gate (scripts/verify_tested_artifacts.mjs) requires.
on:
  workflow_dispatch: {}
  workflow_call: {}

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: macos-15-intel
            target: x86_64-apple-darwin
          - host: macos-latest
            target: aarch64-apple-darwin
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            build_target: x86_64-unknown-linux-gnu.2.28
            build_flags: --cross-compile
          - host: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.host }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target }}

      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.x
          cache: 'npm'

      - name: npm ci
        run: npm ci

      # Linking against glibc 2.28 symbols keeps the addon loadable on every platform
      # Node 18-24 support (Ubuntu 20.04, Debian 10, RHEL 8) instead of the runner's glibc.
      - name: Install zig and cargo-zigbuild
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          python3 -m venv "$RUNNER_TEMP/zig"
          "$RUNNER_TEMP/zig/bin/pip" install ziglang==0.16.0
          echo "$RUNNER_TEMP/zig/bin" >> "$GITHUB_PATH"
          cargo install cargo-zigbuild --version 0.23.4 --locked

      - name: Build native addon (${{ matrix.target }})
        run: npm run build -- --target ${{ matrix.build_target || matrix.target }} ${{ matrix.build_flags }} -- --locked

      # Pre-assembly check on the build host: stages this target alone, installs it,
      # and type-checks the CJS and ESM declarations.
      - name: Install and test packed native package
        run: npm run test:package -- --target ${{ matrix.target }} --output target/release-packages/${{ matrix.target }}

      - name: Upload build-host test record
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: precheck-${{ matrix.target }}
          path: target/release-packages/${{ matrix.target }}/manifest.json
          if-no-files-found: error

      - name: Upload native addon
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: bindings-${{ matrix.target }}
          path: '*.node'
          if-no-files-found: error

  assemble:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.x
          cache: 'npm'

      - name: npm ci
        run: npm ci

      - name: Require matching npm and crate versions
        run: |
          crate=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          package=$(node -p "require('./package.json').version")
          test -n "$crate" && test "$crate" = "$package" || { echo "package.json $package differs from Cargo.toml $crate" >&2; exit 1; }

      - name: Download all platform binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: bindings-*
          path: artifacts
          merge-multiple: true

      - name: Create per-platform npm packages
        run: npx --no-install napi create-npm-dirs

      - name: Move downloaded artifacts into place
        run: npx --no-install napi artifacts --output-dir artifacts

      # `--skip-optional-publish` only writes the root optionalDependencies; nothing is
      # uploaded here or anywhere outside the publish job's gate.
      - name: Stage notices and root dependencies without publishing
        run: |
          node scripts/release_artifacts.mjs --stage-notices
          npx --no-install napi prepublish -t npm --skip-optional-publish --no-gh-release

      - name: Pack the release tarballs once
        run: node scripts/release_artifacts.mjs pack release-packages

      - name: Upload release tarballs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-packages
          path: release-packages/*
          if-no-files-found: error

  smoke:
    needs: assemble
    strategy:
      fail-fast: false
      # target x node is the cross product; `include` only attaches the runner to each target.
      # (An `include` list beside a `node` list would instead stamp every entry onto all 5 jobs.)
      matrix:
        target: [x86_64-apple-darwin, aarch64-apple-darwin, x86_64-unknown-linux-gnu, x86_64-pc-windows-msvc]
        node: [18, 20, 22, 24, 26]
        include:
          - target: x86_64-apple-darwin
            host: macos-15-intel
          - target: aarch64-apple-darwin
            host: macos-latest
          - target: x86_64-unknown-linux-gnu
            host: ubuntu-latest
          - target: x86_64-pc-windows-msvc
            host: windows-latest
    runs-on: ${{ matrix.host }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-packages
          path: release-packages

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node }}.x

      # The TypeScript compiler is a development dependency, so declarations are
      # checked once per target on the current LTS rather than on every Node line.
      - name: Install the TypeScript compiler
        if: matrix.node == 24
        run: npm ci

      - name: Install the assembled tarballs and run the consumers
        env:
          NODE_MAJOR: ${{ matrix.node }}
          ATTESTATION: attestations/${{ matrix.target }}-node${{ matrix.node }}.json
        run: |
          args=(--release release-packages --attest "$ATTESTATION")
          if [ "$NODE_MAJOR" = 24 ]; then args+=(--types); fi
          npm run test:package -- "${args[@]}"

      - name: Upload smoke attestation
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: attestation-${{ matrix.target }}-node${{ matrix.node }}
          path: attestations/${{ matrix.target }}-node${{ matrix.node }}.json
          if-no-files-found: error
