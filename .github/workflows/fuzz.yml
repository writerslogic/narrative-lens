name: Fuzz

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '19 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: nightly

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --version 0.13.2 --locked

      - name: Seed corpus
        run: |
          mkdir -p fuzz/corpus/text_analysis
          cp tests/fixtures/manuscript-passages.json fuzz/corpus/text_analysis/manuscript
          printf '“Café,” said Zoë.\n\n雪 fell. 🖋️\n' > fuzz/corpus/text_analysis/unicode

      - name: Fuzz text analysis
        run: cargo +nightly fuzz run text_analysis -- -max_total_time=120 -max_len=4096 -timeout=10

      - name: Preserve failing inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
          if-no-files-found: ignore
