name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: cargo test (default features)
        run: cargo test --workspace

      - name: cargo test (node-api feature)
        run: cargo test --workspace --features node-api

      - name: cargo test (onnx feature)
        run: cargo test --workspace --features onnx

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20.x
          cache: 'npm'

      - name: npm install
        run: npm install

      - name: npm build (debug)
        run: npm run build:debug

      - name: npm test
        run: npm test

      - name: npm test:types
        run: npm run test:types
