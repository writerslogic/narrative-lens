name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: cargo test (default features)
        run: cargo test --workspace

      - name: cargo test (node-api feature)
        run: cargo test --workspace --features node-api

      - name: cargo test (onnx feature)
        run: cargo test --workspace --features onnx

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 20.x
          cache: 'npm'

      - name: npm ci
        run: npm ci

      - name: npm build (debug)
        run: npm run build:debug

      - name: npm test
        run: npm test

      - name: npm test:types
        run: npm run test:types
