name: Release

# Manual only, per the platform-support decision recorded in
# docs/INTEGRATION.md. validate runs CI; assurance (platform-assurance.yml) builds,
# assembles, installs and executes the tarballs on every declared target and Node
# line; publish re-verifies the commit, tarball digests, build-host results and every
# smoke attestation immediately before uploading those same tarballs. Publishing
# needs an NPM_TOKEN secret and the `npm-release` environment (configure required
# reviewers there); everything before the publish job works without them.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/ci.yml

  assurance:
    needs: validate
    uses: ./.github/workflows/platform-assurance.yml

  publish:
    needs: [validate, assurance]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: npm-release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.x
          registry-url: 'https://registry.npmjs.org'

      - name: Download the assembled tarballs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-packages
          path: release-packages

      - name: Download smoke attestations
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: attestation-*
          path: attestations

      - name: Download build-host test records
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: precheck-*
          path: prechecks

      # Fails closed unless the commit, tarball digests, tested binaries and all
      # 4 targets x 5 Node lines of smoke attestations agree.
      - name: Verify the tested release
        run: node scripts/verify_tested_artifacts.mjs --release release-packages --attestations attestations --prechecks prechecks

      # Uploads the verified tarballs themselves (no rebuild, no lifecycle scripts):
      # platform packages first, then the root that depends on them. Versions already
      # published with identical content are skipped, so a partial run can be resumed.
      - name: Publish the verified tarballs
        run: node scripts/release_artifacts.mjs publish release-packages --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
