name: Release

# Manual only, per the platform-support decision recorded in
# docs/INTEGRATION.md: cross-compile+publish native binaries for the 4
# targets package.json's `napi.targets` already declares, gated behind an
# explicit trigger rather than firing on every push/tag. Requires an
# NPM_TOKEN secret (Settings -> Secrets and variables -> Actions) with
# publish rights to the `narrative-lens` package before the publish job can
# do anything -- everything up to that point (build + artifact upload) works
# without it, so a run without the secret still validates the cross-compile
# matrix.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: macos-latest
            target: x86_64-apple-darwin
          - host: macos-latest
            target: aarch64-apple-darwin
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - host: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.host }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20.x
          cache: 'npm'

      - name: npm install
        run: npm install

      - name: Build native addon (${{ matrix.target }})
        run: npm run build -- --target ${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bindings-${{ matrix.target }}
          path: '*.node'
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20.x
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: npm install
        run: npm install

      - name: Download all platform artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: true

      - name: Create per-platform npm packages
        run: npx napi create-npm-dirs

      - name: Move downloaded artifacts into place
        run: npx napi artifacts --output-dir artifacts

      # `napi prepublish` updates each per-platform package.json (version,
      # optionalDependencies on the root package) and runs `npm publish` for
      # every platform package plus the root -- always under whatever dist-tag
      # npm defaults to (`latest`) for the version in package.json. The napi
      # CLI has no dist-tag override; publishing under `next`/a pre-release
      # tag means bumping to a pre-release version first (`npm version
      # prerelease`) rather than a flag here.
      - name: npm publish (all platform packages + main package)
        run: |
          npm config set provenance true
          npx napi prepublish -t npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
