name: Publish crate

on:
  release:
    types: [published]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: validate
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false

    - name: Install Rust
      uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

    # A tag that disagrees with the manifest would publish the wrong crate version.
    - name: Require the release tag to match Cargo.toml
      env:
        TAG: ${{ github.event.release.tag_name }}
      run: |
        version=$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "narrative-lens") | .version')
        test -n "$version" && test "$TAG" = "v$version" || { echo "release tag $TAG does not match Cargo.toml version $version" >&2; exit 1; }

    - name: Verify package
      run: cargo publish --locked --dry-run

    - name: Publish to crates.io
      run: cargo publish --locked
      env:
        CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
